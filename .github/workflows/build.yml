name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test DriveVisualizer.Tests -c Release

      - name: Build MSIX (unsigned, x64)
        run: >
          dotnet build DriveVisualizer.App -c Release -p:Platform=x64
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageDir=${{ github.workspace }}\artifacts\msix\
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:AppxBundle=Never
          -p:AppxPackageSigningEnabled=false
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=false

      - name: Build Store upload package (.msixupload)
        run: >
          dotnet build DriveVisualizer.App -c Release -p:Platform=x64
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageDir=${{ github.workspace }}\artifacts\store\
          -p:UapAppxPackageBuildMode=StoreUpload
          -p:AppxBundle=Never
          -p:AppxPackageSigningEnabled=false
          -p:AppxSymbolPackageEnabled=false
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=false

      - name: Publish self-contained (for MSI)
        run: >
          dotnet publish DriveVisualizer.App -c Release -r win-x64 --self-contained
          -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
          -p:PublishTrimmed=false -p:PublishReadyToRun=false
          -o artifacts\publish

      - name: Build MSI (WiX 5)
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build installer\Package.wxs -d "PublishDir=${{ github.workspace }}\artifacts\publish" -arch x64 -o artifacts\msi\DriveVisualizer.msi

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: DriveVisualizer-msix-unsigned
          path: artifacts/msix/**/*.msix
          if-no-files-found: error

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: DriveVisualizer-msi
          path: artifacts/msi/DriveVisualizer.msi
          if-no-files-found: error

      - name: Upload Store package
        uses: actions/upload-artifact@v4
        with:
          name: DriveVisualizer-store-upload
          path: artifacts/store/**/*.msixupload
          if-no-files-found: error
